name: 📥 提交收录申请 (Suggest an agent)
description: 收录你正在用、但不在 AgentNews 榜上的 AI agent（PRD §4 有收录门槛，人工审核后才会进榜）。
title: "[收录] "
labels: [candidate]
body:
  - type: input
    id: name
    attributes:
      label: 产品/工具名称
      placeholder: e.g. Claude Code
    validations:
      required: true

  - type: input
    id: homepage
    attributes:
      label: 官网 / 落地页 URL
      description: 官网、GitHub 或应用商店页面，至少一个可访问
      placeholder: https://
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: GitHub 仓库（可选）
      description: owner/repo 格式，如 anthropics/claude-code
      placeholder: owner/repo

  - type: dropdown
    id: form
    attributes:
      label: 形态（主要使用场景）
      description: 只归入一个主形态（PRD §4.2）
      options:
        - cli（终端编码 agent）
        - ide-plugin（IDE 插件）
        - ide-app（AI IDE / 一体化编辑器）
        - desktop（桌面应用）
        - browser（浏览器 agent / 扩展）
        - framework（多智能体框架）
        - platform（agent 平台）
        - autonomous（通用自主 agent）
        - assistant（助手）
    validations:
      required: true

  - type: dropdown
    id: oss
    attributes:
      label: 开源 / 闭源
      options:
        - 开源（OSI 协议：MIT / Apache-2.0 等）
        - 源码可见但非 OSI（BUSL / SSPL / 无 License）
        - 闭源 / 专有
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么值得收录（可选）
      description: 在用人数、分发渠道（npm / VS Code 商店等）、媒体报道、与你所在形态榜里已有产品的差异。开源项目 star ≥ 500 或周下载 ≥ 3000 优先收录（PRD §4.4）。
      placeholder: e.g. 终端里替代 X 的产品，npm 周下载 1 万+，被 Y 报道过……

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 这是一个"用户可直接使用的 agent 产品/工具"，不是纯 SDK / 纯 MCP Server / Prompt 模板
          required: true
        - label: 允许 AgentNews 收录并公开展示其公开数据
          required: true