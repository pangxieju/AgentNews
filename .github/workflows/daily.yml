name: daily

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:

# 需要写权限来回写 data/ 快照
permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 站点地址（可在 Repo Settings → Variables 里用 SITE_URL 覆盖）
      SITE_URL: ${{ vars.SITE_URL || 'https://agentnews-c5h.pages.dev' }}
      # 只有在配置了 CF secrets 时才部署（未配置则只采集+提交）
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 数据契约先校验；算法回归先跑（校验失败绝不出榜）
      - run: pnpm validate
      - run: pnpm test

      - name: Collect & score
        run: pnpm collect
        env:
          # Actions 自动注入：5000 次/小时，足够覆盖当前 47 个 repo × 3 请求
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snapshots
        run: |
          git config user.name  'agentnews-bot'
          git config user.email 'bot@agentnews.dev'
          git add data/ agents.yaml packages/web/public/icons
          if git diff --staged --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push
          fi

      # 构建 + 直接部署到 Cloudflare Pages（不依赖 CF↔GitHub 集成）
      - name: Build site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: env.CF_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --force：wrangler 4 默认会委托给新版 Workers-Pages，CI 非交互环境需强制走 Pages
        run: pnpm --filter @agentnews/web exec wrangler pages deploy dist --project-name agentnews --force

      - name: Summary
        run: |
          echo "### 采集完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 数据：$(ls data/scores | tail -1)" >> $GITHUB_STEP_SUMMARY
          echo "- 在榜：$(node -e "const j=require('./data/scores/'+require('fs').readdirSync('data/scores').sort().pop());console.log(j.rows.filter(r=>r.rank_in_form!=null).length)") 个" >> $GITHUB_STEP_SUMMARY
          echo "- 站点：https://agentnews-c5h.pages.dev" >> $GITHUB_STEP_SUMMARY