name: daily

on:
  schedule:
    # GitHub 的 schedule 实测会迟到 7 小时以上甚至不触发，主力触发已交给
    # ops/dispatch-worker（Cloudflare Cron，北京 08:05）。这两个 cron 只作兜底。
    #
    # 为什么最早只能排到 00:05Z（北京 08:05）：快照文件名和「今天是否已采过」的守卫
    # 都用 UTC 日期，排在 00:00Z 之前会算成前一天，守卫会误判为「已采过」而不采集。
    - cron: "20 0 * * *" # UTC 00:20 = 北京时间 08:20
    # 兜底：上面那轮被丢弃时补跑。当天已有快照就跳过采集，只构建+部署
    # （部署失败也能靠这一轮自愈，不会因为「今天采过了」而放弃发布）。
    - cron: "40 0 * * *" # UTC 00:40 = 北京时间 08:40
  workflow_dispatch:

# 需要写权限来回写 data/ 快照
permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 站点地址（可在 Repo Settings → Variables 里用 SITE_URL 覆盖）
      SITE_URL: ${{ vars.SITE_URL || 'https://agentnews-c5h.pages.dev' }}
      # 只有在配置了 CF secrets 时才部署（未配置则只采集+提交，并在 Summary 里报警）
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 今天的快照是否已经采过 —— 兜底那轮不重复采集，只负责构建+部署
      - name: Check today's snapshot
        id: snap
        run: |
          if [ -f "data/snapshots/$(date -u +%F).jsonl" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "今天已有快照（$(date -u +%F)），跳过采集，只构建+部署"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 数据契约先校验；算法回归先跑（校验失败绝不出榜）
      - run: pnpm validate
      - run: pnpm test

      - name: Collect & score
        if: steps.snap.outputs.exists == 'false'
        run: pnpm collect
        env:
          # Actions 自动注入：5000 次/小时，足够覆盖当前 77 个 agent 的请求量
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 图标体检：只出报告，不阻断（缺图/低清时在 Summary 里提醒人工加 icon: 覆盖）
      - name: Icon audit
        continue-on-error: true
        run: pnpm icons:audit

      - name: Commit snapshots
        run: |
          git config user.name  'agentnews-bot'
          git config user.email 'bot@agentnews.dev'
          git add data/ agents.yaml packages/web/public/icons
          if git diff --staged --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push
          fi

      # 构建 + 直接部署到 Cloudflare Pages（不依赖 CF↔GitHub 集成）
      - name: Build site
        run: pnpm build

      # secrets 没配时不要静默跳过：线上不会更新，必须在 Summary 里说清楚
      - name: Deploy preflight
        run: |
          if [ "$CF_READY" != "true" ]; then
            echo "::warning title=未配置 Cloudflare secrets::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，本次只采集不部署，线上站点不会更新。"
          fi

      - name: Deploy to Cloudflare Pages
        if: env.CF_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --force：wrangler 4 默认会委托给新版 Workers-Pages，CI 非交互环境需强制走 Pages
        run: pnpm --filter @agentnews/web exec wrangler pages deploy dist --project-name agentnews --force

      - name: Summary
        run: |
          echo "### 采集完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 数据：$(ls data/scores | tail -1)" >> $GITHUB_STEP_SUMMARY
          echo "- 在榜：$(node -e "const j=require('./data/scores/'+require('fs').readdirSync('data/scores').sort().pop());console.log(j.rows.filter(r=>r.rank_in_form!=null).length)") 个" >> $GITHUB_STEP_SUMMARY
          if [ "$CF_READY" = "true" ]; then
            echo "- 部署：已发布到 Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 部署：**跳过** —— 仓库缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，线上站点没有更新" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 站点：https://agentnews-c5h.pages.dev" >> $GITHUB_STEP_SUMMARY