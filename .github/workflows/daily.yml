name: daily

on:
  schedule:
    # 每天只跑一次：ops/dispatch-worker（Cloudflare Cron）在北京时间 01:00 触发，
    # 采集 → 构建 → 部署在同一次运行里连着做完（约 2~3 分钟），02:00 前全部完成。
    #
    # 下面这个 cron 只是兜底：01:00 那次没成时才补跑（01:30 启动，同样 02:00 前完成）。
    # 当天已发布过就直接退出（见 Preflight 的 deployed 标记），不会重复部署。
    #
    # 所有日期口径都是**北京时间**（UTC+8）：快照/标记的文件名、Preflight 判重都用北京日期。
    - cron: "30 17 * * *" # UTC 17:30 = 北京时间次日 01:30（仅兜底）
  workflow_dispatch:

# 需要写权限来回写 data/ 快照
permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 站点地址（可在 Repo Settings → Variables 里用 SITE_URL 覆盖）
      SITE_URL: ${{ vars.SITE_URL || 'https://agentnews-c5h.pages.dev' }}
      # 只有在配置了 CF secrets 时才部署（未配置则只采集+提交，并在 Summary 里报警）
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 今天是否已经「采集 + 发布」完成过：兜底那轮直接退出，不重复采、不重复部署
      - name: Preflight
        id: pre
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -f "data/deploy/$TODAY.json" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "今天（$TODAY）已经发布过：$(cat "data/deploy/$TODAY.json")"
            echo "本轮不再采集、不再部署，直接结束"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "data/snapshots/$TODAY.jsonl" ]; then
            echo "collected=true" >> "$GITHUB_OUTPUT"
          else
            echo "collected=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "data/snapshots/$(TZ=Asia/Shanghai date +%F).jsonl" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "今天已有快照（$(TZ=Asia/Shanghai date +%F)），跳过采集，只构建+部署"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 数据契约先校验；算法回归先跑（校验失败绝不出榜）
      - run: pnpm validate
        if: steps.pre.outputs.deployed != 'true'
      - run: pnpm test
        if: steps.pre.outputs.deployed != 'true'

      - name: Collect & score
        if: steps.pre.outputs.deployed != 'true' && steps.pre.outputs.collected != 'true'
        run: pnpm collect
        env:
          # Actions 自动注入：5000 次/小时，足够覆盖当前 77 个 agent 的请求量
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 图标体检：只出报告，不阻断（缺图/低清时在 Summary 里提醒人工加 icon: 覆盖）
      - name: Icon audit
        if: steps.pre.outputs.deployed != 'true'
        continue-on-error: true
        run: pnpm icons:audit

      - name: Commit snapshots
        if: steps.pre.outputs.deployed != 'true'
        run: |
          git config user.name  'agentnews-bot'
          git config user.email 'bot@agentnews.dev'
          git add data/ agents.yaml packages/web/public/icons
          if git diff --staged --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: snapshot $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      # 构建 + 直接部署到 Cloudflare Pages（不依赖 CF↔GitHub 集成）
      - name: Build site
        if: steps.pre.outputs.deployed != 'true'
        run: pnpm build

      # secrets 没配时不要静默跳过：线上不会更新，必须在 Summary 里说清楚
      - name: Deploy preflight
        if: steps.pre.outputs.deployed != 'true'
        run: |
          if [ "$CF_READY" != "true" ]; then
            echo "::warning title=未配置 Cloudflare secrets::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，本次只采集不部署，线上站点不会更新。"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.pre.outputs.deployed != 'true' && env.CF_READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --force：wrangler 4 默认会委托给新版 Workers-Pages，CI 非交互环境需强制走 Pages
        run: pnpm --filter @agentnews/web exec wrangler pages deploy dist --project-name agentnews --force

      # 部署成功才写标记：兜底那轮看到标记就直接退出，不会再有第二次部署
      - name: Record deploy
        if: steps.pre.outputs.deployed != 'true' && env.CF_READY == 'true'
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p data/deploy
          TODAY=$TODAY node -e "const fs=require('fs');fs.writeFileSync('data/deploy/'+process.env.TODAY+'.json', JSON.stringify({date:process.env.TODAY,deployed_at:new Date().toISOString(),snapshot:fs.readdirSync('data/snapshots').sort().pop()})+String.fromCharCode(10))"
          git config user.name  'agentnews-bot'
          git config user.email 'bot@agentnews.dev'
          git add data/deploy
          git commit -m "data: deploy 标记 $TODAY"
          git push

      - name: Summary
        run: |
          echo "### 采集完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 数据：$(ls data/scores | tail -1)" >> $GITHUB_STEP_SUMMARY
          echo "- 在榜：$(node -e "const j=require('./data/scores/'+require('fs').readdirSync('data/scores').sort().pop());console.log(j.rows.filter(r=>r.rank_in_form!=null).length)") 个" >> $GITHUB_STEP_SUMMARY
          if [ "$CF_READY" = "true" ] && [ "${{ steps.pre.outputs.deployed }}" != "true" ]; then
            echo "- 部署：已发布到 Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.pre.outputs.deployed }}" = "true" ]; then
            echo "- 部署：今天已发布过，本轮跳过（避免重复部署）" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 部署：**跳过** —— 仓库缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，线上站点没有更新" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 站点：https://agentnews-c5h.pages.dev" >> $GITHUB_STEP_SUMMARY