name: weekly-stats

# 每周一 09:00（北京）出一次「决策会话」周报，作为 Issue 留档。
# 数据源：Cloudflare D1（第一方事件），不依赖第三方分析平台。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Open weekly issue
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TITLE="weekly stats: $(date -u +%F)"
          {
            echo "## AgentNews · weekly stats ($(date -u +%F))"
            echo
            echo '```'
            node ops/stats.mjs --days=7
            echo '```'
            echo
            echo "_decision session = a session with at least one compare or outbound click. Privacy: no cookies, no IP, 90-day retention._"
          } > body.md
          if gh issue list --state all --search "$TITLE in:title" --limit 1 | grep -q .; then
            echo "already reported this week"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
