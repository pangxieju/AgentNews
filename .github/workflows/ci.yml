name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  # 支持手动重跑（改写历史 / 强制推送后不会自动触发）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 第一名：数据契约。agents.yaml 不合法就直接失败，不进入后续步骤
      - run: pnpm validate

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
