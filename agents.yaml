# AgentRank 收录名单 v1 (M0)
# 规则见 docs/PRD.md §4
# - form / oss_bucket 为人工判定
# - oss_bucket: open=OSI 协议 | semi=源码可见但非 OSI | closed=专有
# - 闭源项目不得以 github 为主渠道
# - slug: 小写字母/数字/连字符

