# 候选 watchlist（人手维护的种子）
#
# 为什么需要它：GitHub 搜索 + 权威清单只能发现「有公开 repo」的项目，
# 闭源产品（Amp、Devin 类）和暂时没公开仓库的新品全靠人补。
# 这里放「知道它存在、但还没收录 / 还没核完」的条目，`pnpm discover` 每次核对状态：
#
#   listed     已在 agents.yaml（按 slug / name / github 比对）
#   pending    不在名单里，主页或 repo 可达 → 待人工审核后收录
#   unreachable 主页打不开 / repo 404 → 可能下线或改版，需人工确认
#   archived   repo 已归档（PRD §4.1：归档超 12 个月移出主榜）
#
# 字段：name 必填；form / homepage / github / note 可选
# github 填 owner/repo，脚本会拉 star / pushed_at / archived

# ───────────── 闭源：有产品、没公开 repo ─────────────
- name: Augment Code
  form: ide-plugin
  homepage: https://www.augmentcode.com
  note: IDE 插件本体闭源；终端形态已收录为 auggie

- name: Supermaven
  form: ide-plugin
  homepage: https://supermaven.com
  note: 2024-11 被 Cursor 收购，独立产品已停更，收录前先确认状态

- name: Refact.ai
  form: ide-plugin
  homepage: https://refact.ai
  note: 插件闭源、引擎部分开源（smallcloudai/refact），需先定 oss_bucket

- name: Blackbox AI
